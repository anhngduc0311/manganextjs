services:
  postgres:
    image: postgres:16-alpine
    container_name: truyenkomi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-truyenkomi_db}
    ports:
      # Port 5438 on host -> 5432 in container (avoid conflict with default 5432)
      - "${POSTGRES_HOST_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-truyenkomi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: truyenkomi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Port 6385 on host -> 6379 in container (avoid conflict with default 6379)
      - "${REDIS_HOST_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: truyenkomi_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-truyenkomi_meili_master_key_2026}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
    ports:
      # Port 7705 on host -> 7700 in container (avoid conflict with default 7700)
      - "${MEILI_HOST_PORT:-7705}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truyenkomi_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-truyenkomi_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-truyenkomi_db}?schema=public
      REDIS_URL: redis://redis:6379
      UPSTASH_REDIS_URL_TCP: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-truyenkomi_meili_master_key_2026}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-supersecretjwtkey_truyenkomi_fullstack_2026}
      AUTH_SECRET: ${AUTH_SECRET:-supersecretjwtkey_truyenkomi_fullstack_2026}

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: truyenkomi_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-truyenkomi_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-truyenkomi_db}?schema=public
      REDIS_URL: redis://redis:6379
      UPSTASH_REDIS_URL_TCP: redis://redis:6379

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: truyenkomi_crawler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-truyenkomi_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-truyenkomi_db}?schema=public
      REDIS_URL: redis://redis:6379
      UPSTASH_REDIS_URL_TCP: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-truyenkomi_meili_master_key_2026}
      MANGADEX_API_URL: ${MANGADEX_API_URL:-https://api.mangadex.org}
      CRAWLER_CONTINUOUS: ${CRAWLER_CONTINUOUS:-true}
      CRAWLER_INTERVAL_MINUTES: ${CRAWLER_INTERVAL_MINUTES:-10}
      CRAWLER_MODE: ${CRAWLER_MODE:-hybrid}
      CRAWLER_UPDATES_LIMIT: ${CRAWLER_UPDATES_LIMIT:-20}
      CRAWLER_LIMIT: ${CRAWLER_LIMIT:-20}
      CRAWLER_RESUME: ${CRAWLER_RESUME:-true}
      CRAWLER_SKIP_EXISTING: ${CRAWLER_SKIP_EXISTING:-false}
      CRAWLER_FORCE: ${CRAWLER_FORCE:-false}
      CHECKPOINT_FILE: /app/.checkpoint/.mangadex-checkpoint.json
    volumes:
      - crawler_checkpoint:/app/.checkpoint

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  crawler_checkpoint:
    driver: local
