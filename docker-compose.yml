services:
  postgres:
    image: postgres:16-alpine
    container_name: truyenkomi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-truyenkomi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-truyenkomi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: truyenkomi_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: truyenkomi/api:net10
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truyenkomi_api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-truyenkomi};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"
      ConnectionStrings__RedisConnection: "redis:6379,abortConnect=false"
      Jwt__SecretKey: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-min32chars-komi}
      Jwt__Issuer: "TruyenKomi"
      Jwt__Audience: "TruyenKomiUsers"
      Storage__ServiceType: ${STORAGE_TYPE:-Local}
      Storage__BucketName: ${R2_BUCKET_NAME:-truyenkomi}
      Storage__PublicDomain: ${R2_PUBLIC_DOMAIN:-https://images.truyenkomi.site}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: truyenkomi/web:angular
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truyenkomi_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
